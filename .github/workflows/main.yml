name: Download Docker Image

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 暴力拉取最新版 (无视版本号规则)
        run: |
          docker pull bitnami/kafka:latest
          docker save -o kafka-latest.tar bitnami/kafka:latest
          
      - name: 2. 打包提供下载
        uses: actions/upload-artifact@v4
        with:
          name: kafka-latest-tar-package
          path: kafka-latest.tar
