name: Download Docker Image

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 实时查询并拉取真实标签 (绝不靠猜)
        run: |
          # 直接调用 Docker Hub 官方 API，抓取当前真实存在的 3.x 长标签
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/bitnami/kafka/tags/?page_size=100" | grep -o '"name":"3\.[0-9]*\.[0-9]*-debian-[^"]*"' | head -n 1 | cut -d'"' -f4)
          echo "在官方库查找到的绝对精确标签为: bitnami/kafka:$TAG"
          
          # 用查到的真实名字拉取并打包
          docker pull bitnami/kafka:$TAG
          docker save -o kafka-bitnami.tar bitnami/kafka:$TAG
          
      - name: 2. 提供离线包下载
        uses: actions/upload-artifact@v4
        with:
          name: kafka-bitnami-tar
          path: kafka-bitnami.tar
