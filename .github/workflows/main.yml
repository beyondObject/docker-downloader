name: Download Docker Image

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 彻底绕过限流抓取标签与镜像
        run: |
          # 1. 用 skopeo 走原生通信协议，抓取全部标签，彻底避开网页 API 的防爬虫拦截
          ALL_TAGS=$(skopeo list-tags docker://docker.io/bitnami/kafka)
          
          # 2. 精准筛选出 3.x 系列最新鲜的真实长标签（涵盖 3.6、3.7、3.8 等）
          REAL_TAG=$(echo "$ALL_TAGS" | jq -r '.Tags[]' | grep -E '^3\.[0-9]+\.[0-9]+-debian-[0-9]+-r[0-9]+$' | sort -V | tail -n 1)
          
          echo "===== 成功锁定底层真实存在的标签: bitnami/kafka:$REAL_TAG ====="
          
          # 3. 稳稳地拉取并打包
          docker pull bitnami/kafka:$REAL_TAG
          docker save -o kafka-image.tar bitnami/kafka:$REAL_TAG
          
          # 4. 把抓到的精确名字写进文本文件，免得你手敲出错
          echo "bitnami/kafka:$REAL_TAG" > image_name.txt
          
      - name: 提供离线包与名字下载
        uses: actions/upload-artifact@v4
        with:
          name: kafka-offline-package
          path: |
            kafka-image.tar
            image_name.txt
